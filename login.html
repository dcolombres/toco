<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TOCO Gestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-surface font-body h-screen flex flex-col items-center justify-center px-4">

    <div class="w-full max-w-md bg-white p-8 rounded-toco card-shadow fade-in">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-block">
                <h1 class="text-3xl font-title font-extrabold text-primary mb-2 tracking-tight">TOCO <span class="text-text-main">Gestión</span></h1>
            </a>
            <p class="text-text-sec">Acceso Panel Toker</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div class="space-y-2">
                <label class="text-xs font-bold uppercase tracking-widest text-text-sec">Email</label>
                <input type="email" id="email" required placeholder="tu@email.com" class="w-full px-4 py-3 rounded-toco border border-gray-100 bg-surface focus:border-primary focus:ring-4 focus:ring-primary/10 outline-none transition-all">
            </div>

            <div class="space-y-2">
                <label class="text-xs font-bold uppercase tracking-widest text-text-sec">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-toco border border-gray-100 bg-surface focus:border-primary focus:ring-4 focus:ring-primary/10 outline-none transition-all">
            </div>

            <button type="submit" class="btn-primary w-full">
                Ingresar <i data-lucide="log-in" class="w-5 h-5"></i>
            </button>
        </form>

        <div id="demo-hint" class="hidden mt-6 p-4 rounded-toco bg-surface border border-gray-100 text-xs text-text-sec space-y-1">
            <p class="font-bold text-text-main uppercase tracking-widest text-[10px]">Modo demo</p>
            <p>Toker: <code class="text-primary">toker@demo.toco</code> / <code>demo</code></p>
            <p>Admin: <code class="text-primary">admin@demo.toco</code> / <code>demo</code></p>
        </div>

        <div class="mt-8 flex justify-between items-center">
            <a href="index.html" class="text-xs text-text-sec hover:text-primary transition-colors flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-3 h-3"></i> Volver a la web
            </a>
            <a id="forgot-password-link" href="#" class="text-xs text-primary font-semibold">¿Olvidaste tu contraseña?</a>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/config.js"></script>
    <script src="js/panel-demo.js"></script>
    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();
        document.getElementById('forgot-password-link').href = TOCO_WA('Hola, olvidé mi contraseña del panel');

        (async () => {
            const demo = await Mode.resolve();
            const hint = document.getElementById('demo-hint');
            if (demo && hint) {
                hint.classList.remove('hidden');
                document.getElementById('email').value = 'toker@demo.toco';
                document.getElementById('password').value = 'demo';
            }
        })();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const user = await API.login(email, password);
                if (user.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        });
    </script>
</body>
</html>
