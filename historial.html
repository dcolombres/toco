<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial - TOCO Gestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-surface font-body pb-32" id="history-view">

    <!-- Header -->
    <header class="bg-white px-6 py-6 border-b border-gray-100 sticky top-0 z-40">
        <h1 class="text-xl font-title font-extrabold text-text-main">Mi historial de ventas</h1>
    </header>

    <main class="p-6 max-w-2xl mx-auto">
        <!-- Search/Filter (Visual placeholder) -->
        <div class="relative mb-6">
            <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-text-sec"></i>
            <input type="text" placeholder="Buscar por comercio..." class="w-full pl-12 pr-4 py-3 rounded-toco border border-gray-100 bg-white focus:border-primary outline-none transition-all shadow-sm">
        </div>

        <!-- History List -->
        <div id="history-list">
            <!-- Items injected by app.js -->
            <div class="text-center py-20 text-text-sec italic">No hay ventas registradas todavía.</div>
        </div>
    </main>

    <!-- Totals Summary (Sticky at bottom above nav) -->
    <div class="fixed bottom-20 left-0 w-full bg-white border-t border-gray-100 px-6 py-4 shadow-2xl z-40">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="text-center">
                <p class="text-[10px] font-bold uppercase text-text-sec">Unidades</p>
                <p class="font-bold text-text-main" id="hist-total-units">0</p>
            </div>
            <div class="text-center">
                <p class="text-[10px] font-bold uppercase text-text-sec">Ganancia Total</p>
                <p class="font-bold text-secondary" id="hist-total-profit">$0</p>
            </div>
            <div class="text-center">
                <p class="text-[10px] font-bold uppercase text-text-sec">Deuda Total</p>
                <p class="font-bold text-error" id="hist-total-debt">$0</p>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-100 px-6 py-4 flex justify-between items-center z-50">
        <a href="dashboard.html" class="flex flex-col items-center gap-1 text-text-sec">
            <i data-lucide="home" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Inicio</span>
        </a>
        <a href="registrar-venta.html" class="flex flex-col items-center gap-1 text-text-sec">
            <i data-lucide="plus-square" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Vender</span>
        </a>
        <a href="historial.html" class="flex flex-col items-center gap-1 active text-primary">
            <i data-lucide="list" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Historial</span>
        </a>
        <a href="estadisticas.html" class="flex flex-col items-center gap-1 text-text-sec">
            <i data-lucide="bar-chart-3" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Stats</span>
        </a>
        <a href="perfil.html" class="flex flex-col items-center gap-1 text-text-sec">
            <i data-lucide="user" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Perfil</span>
        </a>
    </nav>

    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();
        if (State.currentUser) {
            UI.updateHistory();
        }
    </script>
</body>
</html>
