<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas y Clientes - TOCO Gestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-surface font-body pb-32" id="stats-view">

    <!-- Header -->
    <header class="bg-white px-6 py-6 border-b border-gray-100 sticky top-0 z-40 flex items-center justify-between">
        <h1 class="text-xl font-title font-extrabold text-text-main">Analítica y Comercios</h1>
        <div class="flex gap-2">
             <button onclick="location.reload()" class="w-10 h-10 bg-surface rounded-full flex items-center justify-center text-text-sec">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <main class="p-6 max-w-4xl mx-auto space-y-8">
        
        <!-- Summary Stats Grid -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-toco card-shadow fade-in">
                <p class="text-[10px] font-bold uppercase tracking-widest text-text-sec mb-1">Total Vendido</p>
                <p class="text-2xl font-title font-extrabold text-text-main" id="stat-total-units">0</p>
            </div>
            <div class="bg-white p-4 rounded-toco card-shadow fade-in">
                <p class="text-[10px] font-bold uppercase tracking-widest text-text-sec mb-1">Comercios</p>
                <p class="text-2xl font-title font-extrabold text-primary" id="stat-total-clients">0</p>
            </div>
            <div class="bg-white p-4 rounded-toco card-shadow fade-in">
                <p class="text-[10px] font-bold uppercase tracking-widest text-text-sec mb-1">Promedio Venta</p>
                <p class="text-2xl font-title font-extrabold text-secondary" id="stat-avg-sale">0</p>
            </div>
            <div class="bg-white p-4 rounded-toco card-shadow fade-in">
                <p class="text-[10px] font-bold uppercase tracking-widest text-text-sec mb-1">Efectividad</p>
                <p class="text-2xl font-title font-extrabold text-text-main">92%</p>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="grid md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-toco card-shadow fade-in">
                <h3 class="font-title font-bold text-sm mb-6 uppercase tracking-wider text-text-sec">Tendencia de Ventas</h3>
                <canvas id="salesChart" height="200"></canvas>
            </div>
            <div class="bg-white p-6 rounded-toco card-shadow fade-in">
                <h3 class="font-title font-bold text-sm mb-6 uppercase tracking-wider text-text-sec">Top Comercios</h3>
                <div id="clients-list" class="space-y-1">
                    <!-- Injected -->
                </div>
            </div>
        </div>

        <!-- Clients Directory -->
        <div class="fade-in">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-title font-bold text-text-main uppercase tracking-widest text-xs">Directorio de Comercios</h2>
                <a href="comercios.html" class="btn-ghost !text-xs">Gestionar todos <i data-lucide="external-link" class="w-3 h-3"></i></a>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-100 px-6 py-4 flex justify-between items-center z-50">
        <a href="dashboard.html" class="flex flex-col items-center gap-1 text-text-sec">
            <i data-lucide="home" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Inicio</span>
        </a>
        <a href="registrar-venta.html" class="flex flex-col items-center gap-1 text-text-sec">
            <i data-lucide="plus-square" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Vender</span>
        </a>
        <a href="historial.html" class="flex flex-col items-center gap-1 text-text-sec">
            <i data-lucide="list" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Historial</span>
        </a>
        <a href="estadisticas.html" class="flex flex-col items-center gap-1 active text-primary">
            <i data-lucide="bar-chart-3" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Stats</span>
        </a>
        <a href="perfil.html" class="flex flex-col items-center gap-1 text-text-sec">
            <i data-lucide="user" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Perfil</span>
        </a>
    </nav>

    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();

        async function initCharts() {
            await UI.initResellerStats();
            const reseller = State.getCurrentReseller();
            if (!reseller) return;

            // Charts
            const ctxSales = document.getElementById('salesChart').getContext('2d');
            new Chart(ctxSales, {
                type: 'line',
                data: {
                    labels: reseller.sales.slice(0, 7).reverse().map(s => UI.formatDate(s.timestamp)),
                    datasets: [{
                        label: 'Unidades',
                        data: reseller.sales.slice(0, 7).reverse().map(s => s.quantity),
                        borderColor: '#FB8500',
                        backgroundColor: 'rgba(251, 133, 0, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
            });
        }

        if (State.currentUser) {
            initCharts();
        }
    </script>
</body>
</html>
