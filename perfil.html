<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - TOCO Gestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-surface font-body pb-32">

    <!-- Header -->
    <header class="bg-white px-6 py-6 border-b border-gray-100 sticky top-0 z-40">
        <h1 class="text-xl font-title font-extrabold text-text-main text-center">Mi Cuenta</h1>
    </header>

    <main class="p-6 max-w-2xl mx-auto space-y-6">
        
        <!-- Profile Info -->
        <div class="bg-white p-8 rounded-3xl card-shadow text-center fade-in">
            <div class="w-24 h-24 bg-primary/10 text-primary rounded-full flex items-center justify-center mx-auto mb-4 font-title font-extrabold text-3xl" id="profile-initial">
                -
            </div>
            <h2 class="text-2xl font-title font-extrabold text-text-main" id="profile-name">Cargando...</h2>
            <p class="text-text-sec text-sm mb-4" id="profile-email">---@---.com</p>
            <span class="px-4 py-1 rounded-full bg-secondary/10 text-secondary text-[10px] font-bold uppercase tracking-widest" id="profile-status">Activo</span>
        </div>

        <!-- Achievement Stats -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-6 rounded-3xl card-shadow border border-gray-50 fade-in">
                <p class="text-[10px] font-bold uppercase text-text-sec mb-1">Total Ganado</p>
                <p class="text-xl font-title font-extrabold text-secondary" id="profile-earnings">$0</p>
            </div>
            <div class="bg-white p-6 rounded-3xl card-shadow border border-gray-50 fade-in">
                <p class="text-[10px] font-bold uppercase text-text-sec mb-1">Unidades Vendidas</p>
                <p class="text-xl font-title font-extrabold text-text-main" id="profile-sales">0</p>
            </div>
        </div>

        <!-- Quick Links -->
        <div class="bg-white rounded-3xl card-shadow overflow-hidden fade-in border border-gray-50">
            <a href="comercios.html" class="flex items-center justify-between p-5 border-b border-gray-50 hover:bg-surface transition-colors">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center text-text-sec"><i data-lucide="store"></i></div>
                    <span class="font-bold text-text-main text-sm">Gestionar Comercios</span>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300"></i>
            </a>
            <a href="estadisticas.html" class="flex items-center justify-between p-5 border-b border-gray-50 hover:bg-surface transition-colors">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center text-text-sec"><i data-lucide="bar-chart-3"></i></div>
                    <span class="font-bold text-text-main text-sm">Ver Estadísticas</span>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300"></i>
            </a>
            <a href="https://wa.me/5491100000000" target="_blank" class="flex items-center justify-between p-5 hover:bg-surface transition-colors">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-green-50 rounded-xl flex items-center justify-center text-secondary"><i data-lucide="help-circle"></i></div>
                    <span class="font-bold text-text-main text-sm">Soporte Técnico</span>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300"></i>
            </a>
        </div>

        <button onclick="State.logout()" class="w-full btn-secondary text-error !border-red-100 hover:!bg-red-50">
            <i data-lucide="log-out"></i> Cerrar Sesión
        </button>

    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-100 px-6 py-4 flex justify-between items-center z-50">
        <a href="dashboard.html" class="flex flex-col items-center gap-1 text-text-sec">
            <i data-lucide="home" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Inicio</span>
        </a>
        <a href="registrar-venta.html" class="flex flex-col items-center gap-1 text-text-sec">
            <i data-lucide="plus-square" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Vender</span>
        </a>
        <a href="historial.html" class="flex flex-col items-center gap-1 text-text-sec">
            <i data-lucide="list" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Historial</span>
        </a>
        <a href="estadisticas.html" class="flex flex-col items-center gap-1 text-text-sec">
            <i data-lucide="bar-chart-3" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Stats</span>
        </a>
        <a href="perfil.html" class="flex flex-col items-center gap-1 active text-primary">
            <i data-lucide="user" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Perfil</span>
        </a>
    </nav>

    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();
        const reseller = State.getCurrentReseller();
        if (reseller) {
            document.getElementById('profile-name').textContent = reseller.name;
            document.getElementById('profile-initial').textContent = reseller.name.charAt(0);
            document.getElementById('profile-email').textContent = reseller.email;
            document.getElementById('profile-status').textContent = reseller.status;
            document.getElementById('profile-earnings').textContent = UI.formatCurrency(reseller.earnings);
            document.getElementById('profile-sales').textContent = reseller.sales.reduce((acc, s) => acc + s.quantity, 0);
        }
    </script>
</body>
</html>
