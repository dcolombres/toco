<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - TOCO Gestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-surface font-body pb-32">

    <!-- Header -->
    <header class="bg-white px-6 py-6 border-b border-gray-100 sticky top-0 z-40">
        <h1 class="text-xl font-title font-extrabold text-text-main text-center">Mi Cuenta</h1>
    </header>

    <main class="p-6 max-w-2xl mx-auto space-y-6">
        
        <!-- Profile Info -->
        <div class="bg-white p-8 rounded-3xl card-shadow text-center fade-in">
            <div class="w-24 h-24 bg-primary/10 text-primary rounded-full flex items-center justify-center mx-auto mb-4 font-title font-extrabold text-3xl" id="profile-initial">
                -
            </div>
            <h2 class="text-2xl font-title font-extrabold text-text-main" id="profile-name">Cargando...</h2>
            <p class="text-text-sec text-sm mb-4" id="profile-email">---@---.com</p>
            <span class="px-4 py-1 rounded-full bg-secondary/10 text-secondary text-[10px] font-bold uppercase tracking-widest" id="profile-status">Toker Activo</span>
        </div>

        <!-- Achievement Stats -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-6 rounded-3xl card-shadow border border-gray-50 fade-in">
                <p class="text-[10px] font-bold uppercase text-text-sec mb-1">Total Ganado</p>
                <p class="text-xl font-title font-extrabold text-secondary" id="profile-earnings">$0</p>
            </div>
            <div class="bg-white p-6 rounded-3xl card-shadow border border-gray-50 fade-in">
                <p class="text-[10px] font-bold uppercase text-text-sec mb-1">Deuda Pendiente</p>
                <p class="text-xl font-title font-extrabold text-error" id="profile-debt">$0</p>
            </div>
        </div>

        <!-- Financial Management Section -->
        <div class="bg-white p-6 rounded-3xl card-shadow border border-gray-50 fade-in">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-title font-bold text-text-main">Gestión de Pagos</h3>
                <button onclick="openPaymentModal()" class="btn-primary !py-2 !px-4 !text-xs">Informar Pago</button>
            </div>

            <div id="payments-history" class="space-y-3">
                <!-- Injected via JS -->
            </div>
        </div>


        <!-- Quick Links -->
        <div class="bg-white rounded-3xl card-shadow overflow-hidden fade-in border border-gray-50">
            <a href="comercios.html" class="flex items-center justify-between p-5 border-b border-gray-50 hover:bg-surface transition-colors">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center text-text-sec"><i data-lucide="store"></i></div>
                    <span class="font-bold text-text-main text-sm">Gestionar Comercios</span>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300"></i>
            </a>
            <a href="estadisticas.html" class="flex items-center justify-between p-5 border-b border-gray-50 hover:bg-surface transition-colors">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center text-text-sec"><i data-lucide="bar-chart-3"></i></div>
                    <span class="font-bold text-text-main text-sm">Ver Estadísticas</span>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300"></i>
            </a>
            <a id="support-whatsapp" href="#" target="_blank" class="flex items-center justify-between p-5 hover:bg-surface transition-colors">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-green-50 rounded-xl flex items-center justify-center text-secondary"><i data-lucide="help-circle"></i></div>
                    <span class="font-bold text-text-main text-sm">Soporte Técnico</span>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300"></i>
            </a>
        </div>

        <button onclick="State.logout()" class="w-full btn-secondary text-error !border-red-100 hover:!bg-red-50">
            <i data-lucide="log-out"></i> Cerrar Sesión
        </button>

    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-100 px-6 py-4 flex justify-between items-center z-50">
        <a href="dashboard.html" class="flex flex-col items-center gap-1 text-text-sec">
            <i data-lucide="home" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Inicio</span>
        </a>
        <a href="registrar-venta.html" class="flex flex-col items-center gap-1 text-text-sec">
            <i data-lucide="plus-square" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Vender</span>
        </a>
        <a href="historial.html" class="flex flex-col items-center gap-1 text-text-sec">
            <i data-lucide="list" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Historial</span>
        </a>
        <a href="estadisticas.html" class="flex flex-col items-center gap-1 text-text-sec">
            <i data-lucide="bar-chart-3" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Stats</span>
        </a>
        <a href="perfil.html" class="flex flex-col items-center gap-1 active text-primary">
            <i data-lucide="user" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Perfil</span>
        </a>
    </nav>

    <!-- Payment Modal -->
    <div id="paymentModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[100] p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-3xl p-8 shadow-2xl fade-in">
            <h2 class="text-2xl font-title font-extrabold text-text-main mb-2">Informar Pago</h2>
            <p class="text-text-sec text-sm mb-6">Ingresá el monto que enviaste a la fábrica.</p>
            <form id="paymentForm" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-text-sec">Monto en $</label>
                    <input type="number" id="paymentAmount" required min="1" class="w-full px-4 py-3 rounded-toco border border-gray-100 bg-surface focus:border-primary outline-none transition-all text-center text-2xl font-bold">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-text-sec">Referencia / Comprobante</label>
                    <input type="text" id="paymentRef" placeholder="Ej: Transferencia Banco X" class="w-full px-4 py-3 rounded-toco border border-gray-100 bg-surface focus:border-primary outline-none transition-all text-sm">
                </div>
                <div class="flex gap-4">
                    <button type="button" onclick="closePaymentModal()" class="btn-secondary flex-1">Cancelar</button>
                    <button type="submit" class="btn-primary flex-1">Informar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/panel-demo.js"></script>
    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();
        document.getElementById('support-whatsapp').href = TOCO_WA();

        function openPaymentModal() {
            document.getElementById('paymentModal').classList.replace('hidden', 'flex');
        }
        function closePaymentModal() {
            document.getElementById('paymentModal').classList.replace('flex', 'hidden');
        }

        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const amount = Number(document.getElementById('paymentAmount').value);
            const reference = document.getElementById('paymentRef').value;

            try {
                await API.submitPayment({
                    userId: State.currentUser.id,
                    amount,
                    reference
                });
                alert('Pago informado con éxito. Pendiente de aprobación.');
                closePaymentModal();
                initPage();
            } catch (err) {
                alert('Error al informar pago: ' + err.message);
            }
        });

        async function initPage() {
            await State.loadResellerData();
            const reseller = State.getCurrentReseller();
            if (reseller) {
                document.getElementById('profile-name').textContent = reseller.name;
                document.getElementById('profile-initial').textContent = reseller.name.charAt(0);
                document.getElementById('profile-email').textContent = reseller.email;
                document.getElementById('profile-status').textContent = reseller.status || 'Activo';
                document.getElementById('profile-earnings').textContent = UI.formatCurrency(reseller.earnings || 0);
                document.getElementById('profile-debt').textContent = UI.formatCurrency(reseller.debt || 0);

                const history = document.getElementById('payments-history');
                history.innerHTML = '';
                if (reseller.payments.length === 0) {
                    history.innerHTML = '<p class="text-[10px] text-text-sec italic text-center py-4">Sin pagos informados.</p>';
                }
                reseller.payments.forEach(p => {
                    const item = document.createElement('div');
                    item.className = 'flex justify-between items-center p-3 bg-surface rounded-xl border border-gray-50';
                    let statusClass = p.status === 'Aprobado' ? 'text-secondary' : (p.status === 'Rechazado' ? 'text-error' : 'text-text-sec');
                    item.innerHTML = `
                        <div>
                            <p class="font-bold text-xs text-text-main">${UI.formatCurrency(p.amount)}</p>
                            <p class="text-[9px] text-text-sec">${p.reference || 'Sin referencia'}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[9px] font-bold uppercase ${statusClass}">${p.status}</p>
                            <p class="text-[8px] text-text-sec">${UI.formatDate(p.timestamp)}</p>
                        </div>
                    `;
                    history.appendChild(item);
                });
            }
        }
        initPage();
    </script>
</body>
</html>
